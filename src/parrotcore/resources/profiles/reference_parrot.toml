[body]
name = "reference_parrot_8dof"
protocol = "featherbus-v0"

[creature]
species = "parrot"
morphology = "perching_bird"
role = "talking_companion"
capabilities = ["speech", "gaze", "blink", "beak_sync", "wing_gesture", "tail_gesture", "perch"]

[simulation]
# v0.5.1 physical electrical parameters live in hardware/v1_component_baseline.toml.
# These remaining values are geometry/safety design targets, not measurements.
model_mass_kg = 1.80
target_height_m = 0.34
watchdog_s = 0.75

[hardware]
baseline_id = "parrot_v1_2026-08-16"
component_file = "hardware/v1_component_baseline.toml"
actuator_map_file = "hardware/v1_actuator_map.toml"

[joints.neck_yaw]
actuator_model = "sts3215"
minimum = -60.0
maximum = 60.0
home = 0.0
max_speed = 180.0
controller_id = 0

[joints.neck_pitch]
actuator_model = "sts3215"
minimum = -35.0
maximum = 40.0
home = 0.0
max_speed = 160.0
controller_id = 1

[joints.beak]
actuator_model = "st3036"
minimum = 0.0
maximum = 35.0
home = 0.0
max_speed = 220.0
controller_id = 2

[joints.wing_left]
